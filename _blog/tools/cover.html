<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600;700&family=Geist+Mono:wght@500&display=block">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{position:relative;background:#0b0d12;color:#fff;font-family:"Geist","Helvetica Neue",Arial,sans-serif;padding:64px 72px}
  .glow{position:absolute;right:-180px;top:-220px;width:720px;height:720px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,138,61,.34),rgba(255,138,61,0))}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(90deg,transparent,#000 70%)}
  .wrap{position:relative;height:100%;display:flex;flex-direction:column}
  .brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:30px;letter-spacing:-.03em}
  .brand img{width:42px;height:42px}
  .kicker{margin-top:auto;font:500 20px/1 "Geist Mono",Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:#ff8a3d}
  h1{margin-top:20px;max-width:960px;font-weight:600;font-size:{{size}}px;line-height:1.04;letter-spacing:-.045em;text-wrap:balance}
  .foot{margin-top:40px;display:flex;justify-content:space-between;align-items:center;font:500 20px/1 "Geist Mono",Menlo,monospace;color:rgba(255,255,255,.62)}
  .bar{position:absolute;left:0;bottom:0;width:100%;height:8px;background:#ff8a3d}
</style>
</head>
<body>
<div class="glow"></div><div class="grid"></div>
<div class="wrap">
  <div class="brand"><img src="{{logo}}" alt="">CallForges</div>
  <div class="kicker">{{kicker}}</div>
  <h1>{{title}}</h1>
  <div class="foot"><span>CallForges team</span><span>callforges.com/blog</span></div>
</div>
<div class="bar"></div>
</body>
</html>
